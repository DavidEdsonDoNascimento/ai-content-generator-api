## Infraestrutura local. Sobe PostgreSQL, Redis, Minio (com o bucket já criado),
## aplica as migrations e sobe API e Worker — tudo com um único
## `docker compose up`.
##
## API e Worker usam a **mesma imagem**, com `command` diferente (ADR-012): mesma
## base de código e mesmas dependências, então duas imagens seriam duplicação.
##
## Ordem de inicialização: postgres e redis saudáveis → `migrate` conclui com
## sucesso → `api` e `worker` sobem. Cada serviço declara só o que de fato usa.
## Minio ainda não é consumido por nenhuma linha de `src/` e por isso não entra em
## nenhum `depends_on` — ele passa a ser dependência do Worker na Fase 6.
##
## Migrations continuam sendo responsabilidade exclusiva do serviço one-shot
## `migrate` (ADR-022). O Worker **não** as aplica: dois processos correndo
## `migrate deploy` ao mesmo tempo disputariam a mesma migration.

services:
  postgres:
    image: postgres:16.14-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_content}
      POSTGRES_USER: ${POSTGRES_USER:-ai_content}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (copie de .env.example)}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7.4.9-alpine3.21
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env (copie de .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env (copie de .env.example)}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # One-shot: cria o bucket e aplica a policy de leitura pública. Ver
  # docker/minio-init.sh e o estágio `minio-init` do Dockerfile.
  minio-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env (copie de .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env (copie de .env.example)}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-content}
    restart: 'no'

  # One-shot: aplica as migrations pendentes (e, se RUN_SEED=true, o seed) antes
  # de a API subir. Concentrar isso num serviço próprio mantém a CLI do Prisma
  # fora da imagem da API e evita que réplicas da API disputem a mesma migration
  # no futuro — ver ADR-022. Se falhar, a API não sobe.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Host interno da rede do compose — nunca `localhost`, que dentro do
      # container apontaria para o próprio container.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_content}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (copie de .env.example)}@postgres:5432/${POSTGRES_DB:-ai_content}
      # Sem a variável, o seed NÃO roda: `.env.example` a define como `true`
      # para o ambiente local (ADR-023).
      RUN_SEED: ${RUN_SEED:-false}
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Ordem de boot e resiliência em runtime são coisas diferentes: esperar o
      # Redis aqui evita que a primeira requisição de `docker compose up` falhe
      # sem motivo, mas a API **não** morre se o Redis cair depois — nesse caso
      # `POST /generate` responde 503 com o crédito estornado, e consultas e
      # cancelamentos seguem funcionando (por isso Redis também não entra em
      # `/ready`).
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      # Fixas: são o contrato interno do container, não a configuração do host.
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_content}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (copie de .env.example)}@postgres:5432/${POSTGRES_DB:-ai_content}
      REDIS_URL: redis://redis:6379
      JOB_ATTEMPTS: ${JOB_ATTEMPTS:-3}
    ports:
      - '${API_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Consome a fila BullMQ. Mesma imagem da API, `command` diferente (ADR-012).
  #
  # Sem healthcheck: o Worker não serve HTTP, e inventar uma porta só para
  # satisfazer o Compose adicionaria superfície para nada. O sinal de saúde dele é
  # continuar de pé — o processo vive enquanto consome a fila e encerra com exit 0
  # no SIGTERM, o que é verificável por `docker compose ps` e pelos logs.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: ['node', 'dist/worker.js']
    depends_on:
      # O schema precisa existir antes de o primeiro job ser processado.
      migrate:
        condition: service_completed_successfully
      # Diferente da API, o Worker **começa** falando com o Redis: sem fila, ele
      # não tem o que fazer.
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_content}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (copie de .env.example)}@postgres:5432/${POSTGRES_DB:-ai_content}
      REDIS_URL: redis://redis:6379
      # Padrões do enunciado: 5 s de espera e 20 % de falha. Sobrescrever no .env
      # permite demonstrar o retry de forma determinística.
      AI_DELAY_MS: ${AI_DELAY_MS:-5000}
      AI_FAILURE_RATE: ${AI_FAILURE_RATE:-0.2}
      JOB_ATTEMPTS: ${JOB_ATTEMPTS:-3}

volumes:
  pgdata:
  redisdata:
  miniodata:
